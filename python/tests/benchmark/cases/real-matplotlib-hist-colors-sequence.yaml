strictness: defect
review_comment:
  author: story645
  url: https://github.com/matplotlib/matplotlib/pull/28073#discussion_r1631497567
  body: I'm not seeing code that sets color=colors and you don't test the colors=set, facecolor=None,
    edgecolor=None case, so can you verify that case works as expected?
expect:
  file: lib/matplotlib/axes/_axes.py
  line: 7222
  line_tolerance: 3
  category: bug
  severity: medium
  summary: hist() 的 colors 为 set 时，np.atleast_1d 把整个 set 当成一个颜色对象
  why: np.atleast_1d({'red','blue'}) 得到长度 1 的 object 数组，cycle 之后每个 patch 的颜色都是这个 set，既无法按 dataset 分配，渲染时也不是合法颜色。kwargs
    的 edgecolor/facecolor 同理。
tags:
- real-pr
- input-validation
- plotting
