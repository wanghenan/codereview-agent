  +def remove_trailing_semicolon(src: str) -> Tuple[str, bool]:

  +    """Remove trailing semicolon from Jupyter notebook cell.

  +

  +    For example,

  +

  +        fig, ax = plt.subplots()

  +        ax.plot(x_data, y_data);  # plot data

  +

  +    would become

