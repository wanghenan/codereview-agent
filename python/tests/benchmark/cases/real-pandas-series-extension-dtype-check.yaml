pr: 19520
pr_title: 'ENH: Allow storing ExtensionArrays in containers'
strictness: defect
review_comment:
  author: jorisvandenbossche
  url: https://github.com/pandas-dev/pandas/pull/19520#discussion_r168924788
  body: Side note (maybe I should open an issue, if there is none yet), but `is_dtype` will always return
    True for Categoricals, whatever the categories/ordered attributes, I think? Is this actually what
    we want? As currently doing `pd.Series(pd.Categorical(['a', 'b']), dtype=CategoricalDType(categories=['A',
    'B']))` will just ignore the `dtype` instead of raising an error / coercing.
expect:
  file: pandas/core/series.py
  line: 217
  line_tolerance: 3
  category: bug
  severity: medium
  summary: 用 data.dtype.is_dtype(dtype) 判兼容：Categorical 恒为 True，dtype 被静默忽略
  why: CategoricalDtype.is_dtype 只看 dtype 家族，不看 categories/ordered，pd.Series(pd.Categorical(['a','b']),
    dtype=CategoricalDtype(['A','B'])) 既不报错也不 coerce，传入的 dtype 直接丢失。
