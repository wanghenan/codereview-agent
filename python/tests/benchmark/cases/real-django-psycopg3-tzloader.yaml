  +    from psycopg2.extras import NumericRange, Range  # NOQA\n+\n+    RANGE_TYPES = (DateRange, DateTimeRange,\
  \ DateTimeTZRange, NumericRange)\n+\n+    class IsolationLevel(IntEnum):\n+        READ_UNCOMMITTED\
  \ = extensions.ISOLATION_LEVEL_READ_UNCOMMITTED\n+        READ_COMMITTED = extensions.ISOLATION_LEVEL_READ_COMMITTED\n\
  +        REPEATABLE_READ = extensions.ISOLATION_LEVEL_REPEATABLE_READ\n+        SERIALIZABLE = extensions.ISOLATION_LEVEL_SERIALIZABLE\n\
  +\n+    def _quote(value, connection=None):\n+        adapted = extensions.adapt(value)\n+        if\
  \ hasattr(adapted, \"encoding\"):\n+            adapted.encoding = \"utf8\"\n+        # getquoted()\
  \ returns a quoted bytestring of the adapted value.\n+        return adapted.getquoted().decode()\n\
  +\n+    sql.quote = _quote\n+\n+    def mogrify(sql, params, connection):\n+        with connection.cursor()\
