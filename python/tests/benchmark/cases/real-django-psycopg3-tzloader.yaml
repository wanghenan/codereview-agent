  +            res = super().load(data)\n+            return res.replace(tzinfo=self.timezone)\n \n+ \
  \   def register_tzloader(tz, context):\n+        class SpecificTzLoader(BaseTzLoader):\n+         \
  \   timezone = tz\n \n-def mogrify(sql, params, connection):\n-    with connection.cursor() as cursor:\n\
  -        return cursor.mogrify(sql, params).decode()\n+        context.adapters.register_loader(\"timestamptz\"\
  , SpecificTzLoader)\n+\n+    class DjangoRangeDumper(RangeDumper):\n+        \"\"\"A Range dumper customized\
  \ for Django.\"\"\"\n+\n+        def upgrade(self, obj, format):\n+            # Dump ranges containing\
  \ naive datetimes as tstzrange, because\n+            # Django doesn't use tz-aware ones.\n+       \
  \     dumper = super().upgrade(obj, format)\n+            if dumper is not self and dumper.oid == TSRANGE_OID:\n\
