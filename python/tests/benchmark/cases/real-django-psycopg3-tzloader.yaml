  @@ -1,31 +1,102 @@\n-from enum import IntEnum\n+import ipaddress\n+from functools import lru_cache\n\
  \ \n-from psycopg2 import errors, extensions, sql  # NOQA\n-from psycopg2.extras import DateRange, DateTimeRange,\
