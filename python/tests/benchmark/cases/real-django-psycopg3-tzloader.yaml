id: real-django-psycopg3-tzloader
kind: positive
origin: real-pr
language: python
repo: django/django
base_commit: d44ee518c4c110af25bebdbedbbf9fba04d197aa
pr: 15687
pr_title: 'Fixed #33308 -- Added support for psycopg version 3'
strictness: defect
review_comment:
  author: bluetech
  url: https://github.com/django/django/pull/15687#discussion_r1161316259
  body: "Is this line correct?\r\n\r\nI'm doing something weird - using Django's connection params in\
    \ a non-Django settings (I know it's not recommended, all warranty is off, regular Django not affected).\
    \ The program's timezone is different from the DB timezone. This line causes the time to be read incorrectly,\
    \ because it transforms e.g. `2023-04-09 19:44:32.768813+03:00` to `2023-04-09 19:44:32.768813+00:00`,\
    \ which is a different time.\r\n\r\nI wonder if this is what was really meant, or if this wants to\
    \ be `res.astimezone(tzinfo=self.timezone)` (with special handling of `None`)? That would result in\
    \ `2023-04-09 16:44:32.768813+00:00`.\r\n\r\nOr maybe this assumes the DB timezone == app timezone?\
    \ But in that case, why is this needed at all?"
expect:
  file: django/db/backends/postgresql/psycopg_any.py
  line: 34
  line_tolerance: 3
  category: bug
  severity: high
  summary: psycopg3 的 timestamptz loader 用 replace(tzinfo=) 重贴时区，时间点被平移
  why: TimestamptzLoader.load() 返回的是 UTC 时间；replace(tzinfo=tz) 只换标签不改时间点，库里 19:44+03:00 会被读成 19:44+00:00（差
    3 小时）。应改为 astimezone(self.timezone)。
tags:
- real-pr
- timezone
- psycopg3
diff: "diff --git a/django/db/backends/postgresql/psycopg_any.py b/django/db/backends/postgresql/psycopg_any.py\n\
