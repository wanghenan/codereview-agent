  \ get_adapters_template(use_tz, timezone):\n+        # Create at adapters map extending the base one.\n\
  +        ctx = adapt.AdaptersMap(adapters)\n+        # Register a no-op dumper to avoid a round trip\
  \ from psycopg version 3\n+        # decode to json.dumps() to json.loads(), when using a custom decoder\n\
  +        # in JSONField.\n+        ctx.register_loader(\"jsonb\", TextLoader)\n+        # Don't convert\
  \ automatically from PostgreSQL network types to Python\n+        # ipaddress.\n+        ctx.register_loader(\"\
