  \ import NumericRange, Range  # NOQA\n+try:\n+    from psycopg import ClientCursor, IsolationLevel,\
  \ adapt, adapters, errors, sql\n+    from psycopg.postgres import types\n+    from psycopg.types.datetime\
  \ import TimestamptzLoader\n+    from psycopg.types.json import Jsonb\n+    from psycopg.types.range\
  \ import Range, RangeDumper\n+    from psycopg.types.string import TextLoader\n \n-RANGE_TYPES = (DateRange,\
  \ DateTimeRange, DateTimeTZRange, NumericRange)\n+    Inet = ipaddress.ip_address\n \n+    DateRange\
  \ = DateTimeRange = DateTimeTZRange = NumericRange = Range\n+    RANGE_TYPES = (Range,)\n \n-class IsolationLevel(IntEnum):\n\
  -    READ_UNCOMMITTED = extensions.ISOLATION_LEVEL_READ_UNCOMMITTED\n-    READ_COMMITTED = extensions.ISOLATION_LEVEL_READ_COMMITTED\n\
  -    REPEATABLE_READ = extensions.ISOLATION_LEVEL_REPEATABLE_READ\n-    SERIALIZABLE = extensions.ISOLATION_LEVEL_SERIALIZABLE\n\
  +    TSRANGE_OID = types[\"tsrange\"].oid\n+    TSTZRANGE_OID = types[\"tstzrange\"].oid\n \n+    def\
  \ mogrify(sql, params, connection):\n+        return ClientCursor(connection.connection).mogrify(sql,\
  \ params)\n \n-def _quote(value, connection=None):\n-    adapted = extensions.adapt(value)\n-    if\
