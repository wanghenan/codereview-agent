id: gh-run-drop-repo-scope
kind: positive
origin: injected
language: python
base: python/src/codereview/core/github_client.py
expect:
  file: python/src/codereview/core/github_client.py
  line: 172
  line_tolerance: 5
  category: bug
  severity: high
  summary: gh api 调用丢失 repos/{owner}/{repo} 前缀，请求打到错误端点
  why: 去掉仓库前缀后，get_pull_request 之类调用会访问 api.github.com/pulls/N，返回 404 或完全不同的资源。
tags:
- api
- github
diff: "diff --git a/python/src/codereview/core/github_client.py b/python/src/codereview/core/github_client.py\n\
  --- a/python/src/codereview/core/github_client.py\n+++ b/python/src/codereview/core/github_client.py\n\
  @@ -169,7 +169,7 @@\n             raise RuntimeError(\"GitHub CLI (gh) is not available\"\
  )\n \n         owner, repo = self._get_repo_info()\n-        full_args = [\"gh\"\
  , \"api\", f\"repos/{owner}/{repo}\"] + args\n+        full_args = [\"gh\", \"api\"\
  ] + args\n \n         env = os.environ.copy()\n         if self.github_token:\n"
