diff: "diff --git a/rest_framework/fields.py b/rest_framework/fields.py\n--- a/rest_framework/fields.py\n\
  +++ b/rest_framework/fields.py\n@@ -1376,4 +1389,4 @@\n         self.fail('invalid', format='[DD] [HH:[MM:]]ss[.uuuuuu]')\n\
  \ \n     def to_representation(self, value):\n-        return duration_string(value)\n+        output_format\
  \ = getattr(self, 'format', api_settings.DURATION_FORMAT)\n"
strictness: design
