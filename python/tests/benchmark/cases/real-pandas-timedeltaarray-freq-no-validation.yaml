  +            values = values.copy()\n+        if freq:\n+            freq = to_offset(freq)\n+\n+  \
  \      self._data = values\n+        self._dtype = dtype\n+        self._freq = freq\n+\n+    @classmethod\n\
  +    def _simple_new(cls, values, freq=None, dtype=_TD_DTYPE):\n+        return cls(values, dtype=dtype,\
  \ freq=freq)\n \n     @classmethod\n     def _from_sequence(cls, data, dtype=_TD_DTYPE, copy=False,\n"
