id: real-pandas-timedeltaarray-freq-no-validation
kind: positive
origin: real-pr
language: python
repo: pandas-dev/pandas
base_commit: aa7cb0138da6e20b356e8d9ae1f184e78a04189f
pr: 24024
pr_title: 'REF: DatetimeLikeArray'
strictness: design
review_comment:
  author: jbrockmendel
  url: https://github.com/pandas-dev/pandas/pull/24024#discussion_r243105181
  body: Not doing frequency validation here seems like an invitation to problems.  Users are going to
    assume `TimedeltaArray.__init__` is public and pass incorrect values here and we'll fail to raise.
expect:
  file: pandas/core/arrays/timedeltas.py
  line: 188
  line_tolerance: 3
  category: maintainability
  severity: low
  summary: TimedeltaArray.__init__ 只 to_offset(freq)，不校验 freq 与 values 是否一致
  why: freq 与数据精度不匹配（例如逐小时数据标 freq='D'）不会报错，后续依赖 freq 的方法会给出错误结果；__init__ 是公开入口，用户会以为它会校验。
tags:
- real-pr
- validation
- freq
