id: real-redis-1660-cluster-wait
kind: positive
origin: real-pr
language: python
repo: redis/redis-py
base_commit: eaa56b7d721182541bab087a6d61304c778f7ea9
pr: 1660
pr_title: Adding RedisCluster client to support Redis Cluster Mode
strictness: design
review_comment:
  author: chayim
  url: https://github.com/redis/redis-py/pull/1660#discussion_r740042051
  body: At some point, IMHO you probably want to raise a RedisClusterException if things don't't come
    up and we've made it all the way through the while loop.
file: tests/conftest.py
expect:
  file: tests/conftest.py
  line: 80
  line_tolerance: 3
  category: maintainability
  severity: low
  summary: wait_for_cluster_creation 超时后循环直接结束，测试继续运行
  why: while now < timeout 超时退出后没有 raise；集群没有起来时后续测试仍会执行，失败信息离根因很远，最好在循环结束后抛 RedisClusterException。
tags:
- real-pr
- cluster
- test-helper
