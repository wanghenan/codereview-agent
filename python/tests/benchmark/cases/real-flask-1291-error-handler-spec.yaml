  +        \n+        assert issubclass(exc_class, Exception)\n+        \n+        if issubclass(exc_class,\
  \ HTTPException):\n+            return exc_class, exc_class.code\n+        else:\n+            return\
  \ exc_class, None\n+    \n     @setupmethod\n     def errorhandler(self, code_or_exception):\n     \
  \    \"\"\"A decorator that is used to register a function give a given\n@@ -1208,9 +1161,10 @@ def\
