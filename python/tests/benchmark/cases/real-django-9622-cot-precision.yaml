pr_title: 'Refs #28643 -- Added math database functions.'
review_comment:
  author: wkschwartz
  url: https://github.com/django/django/pull/9622#discussion_r184281246
  body: I haven’t verified this myself, but [this SO answer](https://stackoverflow.com/a/3738696/1286628)
    says it’s better to use cos/sin than 1/tan. Intuitively I understand it near pi/2 but I would expect
    the opposite to be true close to zero. Not sure if there’s a one best option here. Just wanted to
    raise this in case anyone had opinions.
file: django/db/backends/sqlite3/base.py
expect:
  file: django/db/backends/sqlite3/base.py
  line: 185
  line_tolerance: 3
  category: bug
  severity: low
  summary: COT 用 1/tan 实现，在 pi/2 附近精度差且极端输入会溢出
  why: 'COT 注册为 lambda x: 1 / math.tan(x)；tan 在 π/2 附近数值很大，倒数会丢精度并可能得到 inf/0，而 cos/sin 形式在整个定义域更稳定。'
