  \ func (as per the\n+            copy_current_xxx_context functions) doesn't work as the\n+        \
  \    with block will close before the coroutine is awaited.\n+            \"\"\"\n+            if ctx\
  \ is not None:\n+                with ctx:\n+                    return await func(*a, **k)\n+     \
  \       else:\n+                return await func(*a, **k)\n+\n+        return async_to_sync(inner)(*args,\
  \ **kwargs)\n+\n+    return outer\n"
