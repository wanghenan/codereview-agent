diff: "diff --git a/django/db/models/aggregates.py b/django/db/models/aggregates.py\n--- a/django/db/models/aggregates.py\n\
  +++ b/django/db/models/aggregates.py\n@@ -174,3 +175,16 @@\n             raise ValueError(\"Star cannot\
  \ be used with filter. Please specify a field.\")\n         super().__init__(expression, filter=filter,\
  \ **extra)\n \n+    def resolve_expression(self, *args, **kwargs):\n+        result = super().resolve_expression(*args,\
  \ **kwargs)\n+        expr = result.source_expressions[0]\n+\n+        # In case of composite primary\
  \ keys, count the first column.\n+        if isinstance(expr, ColPairs):\n+            if self.distinct:\n\
  +                raise NotSupportedError(\n+                    \"COUNT(DISTINCT) doesn't support composite\
  \ primary keys\"\n+                )\n+\n+            cols = expr.get_cols()\n+            return Count(cols[0],\
  \ filter=result.filter)\n"
