# Configuration for the benchmark corpus (docs/EVAL_SET_DESIGN.md).
#
# The nightly job and the checked-in baseline.json must use the same file, or
# the gate measures the model change instead of a code regression.
#
# OPENCODE_GO_API_KEY is injected by .github/workflows/benchmark.yml; when the
# secret is missing the workflow skips the job instead of running without a key.
llm:
  provider: anthropic
  apiKey: ${OPENCODE_GO_API_KEY}
  baseUrl: https://opencode.ai/zen/go
  model: deepseek-v4.1-flash
  temperature: 0.2
  # Reasoning models spend part of the budget on thinking blocks, so the
  # provider default can leave an empty answer.
  maxTokens: 16000
  headers:
    x-opencode-session: 6f9619ff-8b86-d011-b42d-00c04fc964ff
timeoutSeconds: 300

filters:
  min_confidence: 0.5
